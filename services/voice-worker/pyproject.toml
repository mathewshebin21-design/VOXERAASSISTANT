[project]
name = "voxera-voice-worker"
version = "0.1.0"
description = "VOXERA voice worker prototype (ADR-0005/0006): long-running call sessions that use the VOXERA receptionist brain."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The LiveKit adapter. Not needed for the session core or its tests.
livekit = ["livekit-agents~=1.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
