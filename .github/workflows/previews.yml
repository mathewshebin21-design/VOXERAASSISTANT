name: previews

on:
  push:
    paths: ["apps/previews/**", ".github/workflows/previews.yml"]
  pull_request:
    paths: ["apps/previews/**", ".github/workflows/previews.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/previews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/previews/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Playwright is installed only in CI; the E2E script resolves it at runtime.
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: E2E
        run: |
          npx next start -p 3000 &
          npx wait-on -t 60000 http://localhost:3000
          BASE_URL=http://localhost:3000 npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/previews/e2e-results.json
