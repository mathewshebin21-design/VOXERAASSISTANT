name: db-migrate

# Run database migrations explicitly against ONE named environment. Manual only.
# Each GitHub environment holds its own DATABASE_URL_UNPOOLED secret; protect the
# `production` environment (Settings → Environments) so only the owner can run it.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database
        type: choice
        options: [staging, production, rc1-validation]
        required: true
      action:
        description: check (no changes), upgrade, claim (first run on a database), downgrade
        type: choice
        options: [check, upgrade, claim, downgrade]
        default: check
      confirm_host:
        description: For claim — the database host, typed back exactly
        required: false
      confirm_rc1_sha:
        description: For isolated RC-1 claim only, repeat the approved full source SHA
        required: false
      downgrade_to:
        description: For downgrade — the revision to roll back to (e.g. 0006)
        required: false

concurrency: db-migrate-${{ inputs.environment }}

permissions:
  contents: read

jobs:
  migrate:
    if: inputs.environment != 'rc1-validation'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      # Install the pinned uv wheel from PyPI instead of downloading the GitHub
      # release tarball, which repeatedly returned HTTP 504 on hosted runners.
      # Keep RC-1 unchanged; this applies only to staging/production migrate job.
      - name: Install pinned uv from PyPI
        run: python -m pip install --disable-pip-version-check "uv==0.11.32"
      - run: uv sync --frozen
      - name: ${{ inputs.action }} ${{ inputs.environment }}
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
          CONFIRM_HOST: ${{ inputs.confirm_host }}
          DOWNGRADE_TO: ${{ inputs.downgrade_to }}
        run: |
          case "$ACTION" in
            check)     uv run python scripts/migrate.py --env "$ENVIRONMENT" --check ;;
            upgrade)   uv run python scripts/migrate.py --env "$ENVIRONMENT" ;;
            claim)     uv run python scripts/migrate.py --env "$ENVIRONMENT" --claim --confirm-host "$CONFIRM_HOST" ;;
            downgrade) uv run python scripts/migrate.py --env "$ENVIRONMENT" --downgrade-to "$DOWNGRADE_TO" --yes ;;
          esac

  rc1-check:
    if: inputs.environment == 'rc1-validation' && (inputs.action == 'check' || inputs.action == 'claim') && github.ref == 'refs/heads/codex/rc1-validation'
    runs-on: ubuntu-latest
    environment: rc1-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: python -m unittest discover -s .github/scripts -p 'test_rc1_*.py'
      - run: uv sync --frozen
        working-directory: services/api
      - name: Read-only RC-1 database identity
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          cd services/api
          uv run python ../../.github/scripts/rc1_check.py
      - name: Explicitly approved empty RC-1 claim
        if: inputs.action == 'claim'
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PGSSLMODE: require
          APPROVED_SHA: ${{ inputs.confirm_rc1_sha }}
          CONFIRM_HOST: ${{ inputs.confirm_host }}
        run: |
          python .github/scripts/rc1_claim_gate.py
          cd services/api
          uv run python scripts/migrate.py --env staging --claim-if-empty
  rc1-refuse:
    if: inputs.environment == 'rc1-validation' && ((inputs.action != 'check' && inputs.action != 'claim') || github.ref != 'refs/heads/codex/rc1-validation')
    runs-on: ubuntu-latest
    steps:
      - run: echo "RC-1 requires check or explicitly approved claim on the validation branch"; exit 1
