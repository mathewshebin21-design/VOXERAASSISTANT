name: PR45 isolated hosted acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/uk-india-release-candidate-20261116]
    paths: [apps/previews/scripts/pr45-hosted-isolation.mjs]
permissions:
  contents: read
jobs:
  hosted:
    if: github.ref == 'refs/heads/codex/uk-india-release-candidate-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned PR45 preview isolation and clean up probe
        run: node apps/previews/scripts/pr45-hosted-isolation.mjs
