name: voice-worker

# The voice-worker prototype: session core and LiveKit adapter (ADR-0005/0006). Simulated only:
# no LiveKit server, no audio, no paid provider.
on:
  push:
    paths: ["services/voice-worker/**", ".github/workflows/voice-worker.yml"]
  pull_request:
    paths: ["services/voice-worker/**", ".github/workflows/voice-worker.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice-worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: LiveKit adapter imports and streams against the real livekit-agents package
        run: |
          uv sync --extra livekit
          uv run python - <<'PY'
          import asyncio
          from livekit.agents import llm
          from voxera_worker import livekit_agent as la
          from voxera_worker.session import CallSession

          class Fake:
              async def stream(self, history, cid, lang, out):
                  yield "Hello there."
                  out.metrics = {"rounds": 1}

          ctx = llm.ChatContext()
          ctx.add_message(role="user", content="Are you open today?")
          agent = la.VoxeraAgent(CallSession(Fake()))
          async def run():
              return "".join([p async for p in agent.llm_node(ctx, [], None)])
          assert asyncio.run(run()) == "Hello there."
          print("LiveKit adapter OK")
          PY
      - name: Rehearse SIP launch gates with LiveKit (no network, keys or paid calls)
        run: uv run --extra livekit pytest -q tests/test_livekit_entrypoint.py tests/test_media.py

  staging-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unprivileged staging worker with locked LiveKit dependency
        run: docker build --file services/voice-worker/Dockerfile --tag voxera-staging-worker:ci services/voice-worker
      - name: Fail closed without any configuration or network
        run: |
          if docker run --rm --network none voxera-staging-worker:ci /srv/.venv/bin/python -m voxera_worker.launch_staging check; then
            echo "ERROR: unconfigured worker started"
            exit 1
          fi
      - name: Accept only isolated staging and no SIP (no network)
        run: |
          docker run --rm --network none \
            -e VOXERA_WORKER_ENV=staging \
            -e VOXERA_SIP_ENABLED=false \
            -e VOXERA_API_URL=https://staging-api.example.test \
            -e VOXERA_STAGING_API_HOST=staging-api.example.test \
            -e LIVEKIT_URL=wss://staging-livekit.example.test \
            -e VOXERA_STAGING_LIVEKIT_HOST=staging-livekit.example.test \
            -e LIVEKIT_API_KEY=ci-not-real \
            -e LIVEKIT_API_SECRET=ci-not-real \
            -e VOXERA_WORKER_TOKEN_CMD="echo unused" \
            voxera-staging-worker:ci /srv/.venv/bin/python -m voxera_worker.launch_staging check
      - name: Refuse SIP-enabled configuration (no network)
        run: |
          if docker run --rm --network none \
            -e VOXERA_WORKER_ENV=staging \
            -e VOXERA_SIP_ENABLED=true \
            -e VOXERA_API_URL=https://staging-api.example.test \
            -e VOXERA_STAGING_API_HOST=staging-api.example.test \
            -e LIVEKIT_URL=wss://staging-livekit.example.test \
            -e VOXERA_STAGING_LIVEKIT_HOST=staging-livekit.example.test \
            -e LIVEKIT_API_KEY=ci-not-real \
            -e LIVEKIT_API_SECRET=ci-not-real \
            -e VOXERA_WORKER_TOKEN_CMD="echo unused" \
            voxera-staging-worker:ci /srv/.venv/bin/python -m voxera_worker.launch_staging check; then
            echo "ERROR: staging accepted SIP-enabled configuration"
            exit 1
          fi
