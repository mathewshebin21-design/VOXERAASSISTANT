name: phase11-maintenance
on:
  push:
    branches: [codex/voxera-phase11-billing-contract-20261117]
    paths: [.github/workflows/phase11-maintenance.yml]
permissions:
  contents: write
jobs:
  format-and-safe-audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Format Python with pinned Ruff
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run ruff format app tests migrations
          uv run ruff check app tests migrations
          uv run ruff format --check app tests migrations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/previews/package-lock.json
      - name: Apply nonbreaking npm audit fixes only
        working-directory: apps/previews
        run: |
          npm ci
          npm audit fix || true
          npm audit --audit-level=high || true
      - name: Commit maintenance changes to development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/app services/api/tests services/api/migrations apps/previews/package.json apps/previews/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(phase11): apply pinned formatter and safe dependency fixes"
            git push origin HEAD:codex/voxera-phase11-billing-contract-20261117
          fi
