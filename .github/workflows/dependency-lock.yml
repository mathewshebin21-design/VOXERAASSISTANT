name: dependency-lock
on:
  push:
    branches: [codex/web-dependency-security]
    paths: [.github/workflows/dependency-lock.yml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/previews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve reviewed patch versions without running package scripts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("package.json")
          d = json.loads(p.read_text())
          d["dependencies"]["next"] = "15.5.29"
          d["devDependencies"]["eslint-config-next"] = "15.5.29"
          d["devDependencies"]["postcss"] = "8.5.23"
          d["devDependencies"]["vitest"] = "4.1.12"
          d.setdefault("overrides", {})["postcss"] = "8.5.23"
          p.write_text(json.dumps(d, indent=2) + "\n")
          Path("package-lock.json").rename("package-lock.baseline.json")
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Capture advisory and lock evidence
        run: |
          npm audit --json > dependency-audit.json || true
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for filename in ("package.json", "package-lock.json", "dependency-audit.json"):
              print("VOXERA_FILE_" + filename + "=" + base64.b64encode(Path(filename).read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-resolution
          path: |
            apps/previews/package.json
            apps/previews/package-lock.json
            apps/previews/dependency-audit.json
          retention-days: 7
