name: integration

# Flow front end ↔ Next.js session proxy ↔ VOXERA API ↔ PostgreSQL, driven by a real browser.
on:
  push:
    paths: ["apps/previews/**", "services/api/**", ".github/workflows/integration.yml"]
  pull_request:
    paths: ["apps/previews/**", "services/api/**", ".github/workflows/integration.yml"]

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres-ci-only
      VOXERA_JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/previews/package-lock.json
      - name: Database roles and migrations
        working-directory: services/api
        run: |
          psql -h localhost -U postgres -f deploy/init-roles.sql
          uv sync --frozen
          uv run alembic upgrade head
      - name: Start fake providers and API
        working-directory: services/api
        # Local stand-ins for Anthropic and ElevenLabs: exercises the live path with no keys and no cost.
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:8090
          VOXERA_ANTHROPIC_API_KEY: fake-ci-key
          VOXERA_ELEVENLABS_API_KEY: fake-ci-key
          VOXERA_ELEVENLABS_VOICE_ID: fakevoice
          VOXERA_ELEVENLABS_BASE_URL: http://127.0.0.1:8090
          VOXERA_LIVE_LLM_TOKENS_PER_ORG_MONTH: "200000"
          VOXERA_LIVE_LLM_TOKENS_GLOBAL_MONTH: "1000000"
          VOXERA_LIVE_TTS_CHARS_PER_ORG_MONTH: "20000"
          VOXERA_LIVE_TTS_CHARS_GLOBAL_MONTH: "100000"
        run: |
          nohup uv run python scripts/fake_providers.py 8090 ../../apps/previews/scripts/fixtures/beep.mp3 > fake.log 2>&1 &
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
      - name: Build and start web
        working-directory: apps/previews
        run: |
          npm ci
          npm run build
          VOXERA_API_URL=http://127.0.0.1:8000 nohup npx next start -p 3000 > web.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000 http://127.0.0.1:8000/healthz
      - name: Live end-to-end
        working-directory: apps/previews
        run: |
          npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
          LIVE_FAKES=1 BASE_URL=http://localhost:3000 node scripts/e2e-live.mjs
      - if: failure()
        run: tail -n 100 services/api/api.log apps/previews/web.log
